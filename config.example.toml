# lanscape-atlas example configuration. Copy to $LANSCAPE_DATA_DIR/config.toml.
# Secrets can instead come from LANSCAPE_ROUTER_PASSWORD, LANSCAPE_HA_TOKEN and
# LANSCAPE_API_TOKEN.
data_dir = "/var/lib/lanscape-atlas"
bind_host = "127.0.0.1"
bind_port = 8720
scan_interface = "eth0"
observation_retention_days = 30
ip_match_window_min = 10
# api_token = ""
# Without api_token, the app (pages, /api, /mcp) only accepts these Host headers
# (plus localhost and bind_host) to block DNS rebinding. Add the name a proxy forwards, e.g.
# "atlas.example.com"; "name:*" allows any port; ["*"] disables the check.
# allowed_hosts = ["atlas.example.com"]

# Remove this table (or leave host empty) to disable the ASUS router collector.
[router]
host = "192.0.2.1"
username = "admin"
password = ""
use_ssl = true

# Optional: uncomment to enable Bluetooth via Home Assistant. Left commented here because
# a non-empty url requires a long-lived access token (here or in LANSCAPE_HA_TOKEN).
# [home_assistant]
# url = "http://192.0.2.10:8123"
# token = ""          # or LANSCAPE_HA_TOKEN
# verify_tls = true

# Optional: Bluetooth sighting retention (days) for the nightly prune, and how often (seconds)
# atlas re-subscribes to Home Assistant's advert stream. HA only pushes an advert when its
# payload changes, so each re-subscribe replays HA's latest advert per device (a snapshot);
# "last heard" is accurate to about one snapshot interval. Keep it at 30 or below (the
# "steady" badge needs a sighting in 48 of the last 60 minutes; at 60 snapshots drift
# against minute boundaries and steady devices can look intermittent). Candidates whose best
# signal is below candidate_min_rssi (dBm, -127..0) are listed only on request: far-away
# devices are usually a neighbour's.
[bluetooth]
retention_days = 14
snapshot_s = 30
candidate_min_rssi = -80

[collectors.asusrouter]
enabled = true
interval_s = 120
timeout_s = 30

[collectors.arp]
enabled = true
interval_s = 300
timeout_s = 60

[collectors.mdns]
enabled = true
interval_s = 60
timeout_s = 10

[collectors.ssdp]
enabled = true
interval_s = 600
timeout_s = 10

[collectors.nmap_light]
enabled = true
cron = "17 3 * * *"
timeout_s = 1800
