repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-leaks
        name: check for personal network data
        entry: python scripts/check_leaks.py
        language: system
        pass_filenames: true
